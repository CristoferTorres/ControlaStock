<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedor - ControlaStock</title>

    <link rel="icon" type="image/jpeg" sizes="32x32" href="../img/logoAzulPeque.jpg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css" integrity="sha512-q3eWabyZPc1XTCmF+8/LuE1ozpg5xxn7iO89yfSOd5/oKvyqLngoNGsx8jq92Y8eXJ/IRxQbEC+FGSYxtk2oiw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/Dashboard.css">
</head>
<body class="colorCua">
    <div class="d-flex">

        <!-- ── Sidebar ── -->
        <aside class="colorPri menu">
            <h2 class="h4 mt-4 ml-3 colorTextBlan font-weight-bold">ControlaStock</h2>
            <p class="mt-1 ml-3 colorTextBlan small">Sistema de inventario</p>

            <div class="m-4 borde_delgado colorSext">
                <h3 class="h6 colorTextBlan my-1 ml-3">Empleado</h3>
            </div>

            <div class="colorSext borde_delgado m-4 p-2">
                <div class="d-flex align-items-center">
                    <img src="../img/YukinoXD.jpg" alt="Avatar" class="rounded-circle mr-2" style="width:32px;height:32px;object-fit:cover;">
                    <span class="colorTextBlan small font-weight-bold">Oscar Daniel</span>
                </div>
            </div>

            <ul class="navbar-nav mx-auto" id="menuNav">
                <li class="nav-item activo" data-vista="dashboard">
                    <a class="btn_funciones font-weight-bold d-block" href="#"><i class="fas fa-th-large mr-2"></i>Dashboard</a>
                </li>
                <li class="nav-item" data-vista="ventas">
                    <a class="btn_funciones font-weight-bold d-block" href="#"><i class="fas fa-cash-register mr-2"></i>Ventas</a>
                </li>
                <li class="nav-item" data-vista="inventario">
                    <a class="btn_funciones font-weight-bold d-block" href="#"><i class="fas fa-boxes mr-2"></i>Inventario</a>
                </li>
                <li class="nav-item" data-vista="reportes">
                    <a class="btn_funciones font-weight-bold d-block" href="#"><i class="fas fa-chart-bar mr-2"></i>Reportes</a>
                </li>
                <li class="nav-item" data-vista="actividad">
                    <a class="btn_funciones font-weight-bold d-block" href="#"><i class="fas fa-history mr-2"></i>Actividad</a>
                </li>
            </ul>
        </aside>

        <!-- ── Contenido principal ── -->
        <div class="contenido">

            <!-- Navbar superior -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="collapse navbar-collapse d-flex justify-content-between align-items-center w-100">
                    <form class="form-inline my-2 my-lg-0">
                        <div class="input-group d-flex align-items-center">
                            <div class="input-group-prepend">
                                <button class="btn btn-outline-secondary" type="submit">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                            <input class="form-control border-secondary" type="search" placeholder="Buscar producto, venta, cliente...">
                        </div>
                    </form>

                    <!-- Desktop -->
                    <div class="d-none d-md-flex align-items-center">
                        <div class="conteNoti d-flex align-items-center justify-content-center">
                            <a href="#" class="d-flex align-items-center justify-content-center w-100 h-100" style="text-decoration:none;">
                                <i class="far fa-bell" style="color:#1d3766;"></i>
                            </a>
                        </div>
                        <div class="ml-3 d-flex align-items-center">
                            <img src="../img/YukinoXD.jpg" alt="Avatar" class="rounded borde_delgado" style="width:36px;height:36px;object-fit:cover;">
                            <div class="ml-2">
                                <p class="small font-weight-bold mb-0">Oscar Daniel</p>
                                <p class="small text-muted mb-0" style="font-size:0.75rem;">admin_daniel@controlastock.com</p>
                            </div>
                        </div>
                    </div>

                    <!-- Mobile -->
                    <div class="d-flex align-items-center d-md-none">
                        <div class="conteNoti d-flex align-items-center justify-content-center">
                            <a href="#" style="text-decoration:none;"><i class="far fa-bell" style="color:#1d3766;"></i></a>
                        </div>
                        <p class="mb-0 small ml-2">Oscar Daniel</p>
                    </div>
                </div>
            </nav>

            <!-- ── Zona de vistas ── -->
            <div id="vistaContenido" class="vista-fade">
                <!-- Se inyecta via JS -->
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
    <script type="module" src="../js/router.js"></script>
</body>
</html>
